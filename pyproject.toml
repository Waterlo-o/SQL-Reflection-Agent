[project]
name = "sql-reflection-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Waterlo-o", email = "shukuchiqqe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google-genai>=2.14.0",
    "langgraph>=1.2.9",
    "streamlit>=1.60.0",
]

[project.scripts]
sql-reflection-agent = "sql_reflection_agent:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.36.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
